<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODIN TO DO LIST</title>
<script defer src="main.js"></script></head>

<body>
    <header>
        <h1>Task List</h1>
        <button class="addToDoButton">Add Task</button>
        <dialog class="addToDoDialog">
            <h2>Add Task</h2>
            <form action="">
                <div>
                    <label for="title">Title</label>
                    <input type="text">
                </div>
                <div>
                    <label for="description">Description</label>
                    <input type="text">
                </div>
                <div>
                    <label for="dueDate">Due Date</label>
                    <input type="date">
                </div>
                <div>
                    <label for="priority">Priority</label>
                    <input type="checkbox">
                </div>
                <div>
                    <button>submit</button>
                    <button id="closeButton">close</button>
                </div>
            </form>
        </dialog>
    </header>

    <div id="taskContainer">

        <div class="taskLine">
            <button id="statusButton">✓</button>
            <p id="priorityTag">!</p>
            <div id="taskTagContainer">
                <p id="taskTag">Task</p>
                <p id="descriptionTag">Description of a task. </p>
            </div>
            <p id="dueDateTag">12/03/2025</p>
            <button id="priorityButton">priority</button>
            <button id="deleteButton">X</button>
        </div>



        <!-- <footer>
            <p>Made for Odin Project by Keyur</p>
        </footer> -->

</body>

</html>
