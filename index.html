<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODIN TO DO LIST</title>
<script defer src="main.js"></script></head>

<body>
    <header>
        <h1>Task List</h1>
        <div>
            <button class="toDoListButton">To Do</button>
            <button class="completedListButton">Completed</button>
            <button class="deletedListButton">Deleted</button>
        </div>

        <button class="addToDoButton">Add Task</button>
        <dialog class="addToDoDialog">
            <h2>Add Task</h2>
            <form action="" id="addToDoForm">
                <div>
                    <label for="addTitle">Title</label>
                    <input type="text" id="addTitle">
                </div>
                <div>
                    <label for="addDescription">Description</label>
                    <input type="text" id="addDescription">
                </div>
                <div>
                    <label for="addDueDate">Due Date</label>
                    <input type="date" id="addDueDate">
                </div>
                <div>
                    <label for="addPriority">Priority</label>
                    <input type="checkbox" id="addPriority" value="!">
                </div>
                <div>
                    <button id="submitButton">submit</button>
                    <button id="closeButton">close</button>
                </div>
            </form>
        </dialog>
    </header>

    <div id="taskContainer">

</body>

</html>
